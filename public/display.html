<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stage Timer · Ausgabe</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial, sans-serif}#screen{height:100%;position:relative;display:flex;align-items:center;flex-direction:column;justify-content:flex-start;padding:12vh 1vw 2vh;color:orange}#bar{position:absolute;top:0;left:1.3%;width:97.4%;height:4.5vh;border:1px solid #999;background:linear-gradient(to right,#4a3500 60%,#480000 60%)}#fill{height:100%;background:currentColor;opacity:.5}#time{font-size:20.8vw;font-weight:400;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.7vw;white-space:nowrap}#clock{position:absolute;bottom:0;left:0;width:100%;text-align:center;font-size:6vw;color:#888;font-variant-numeric:tabular-nums}#message{position:absolute;top:57%;left:5%;width:90%;text-align:center;font-size:4.5vw;color:white;white-space:pre-wrap;overflow-wrap:anywhere;max-height:28vh;overflow:hidden}#fullscreen{position:fixed;top:20px;right:20px;padding:10px 15px;color:white;border:1px solid #777;background:#222;opacity:0;transition:opacity .2s;cursor:pointer;z-index:2}body:hover #fullscreen,#fullscreen:focus{opacity:1}#disconnected{display:none;position:fixed;bottom:10px;left:12px;color:#fff;background:#9b2828;padding:7px;font-size:12px}#screen.test{background:repeating-linear-gradient(90deg,#fff 0 14.28%,#ff0 14.28% 28.56%,#0ff 28.56% 42.84%,#0f0 42.84% 57.12%,#f0f 57.12% 71.4%,#f00 71.4% 85.68%,#00f 85.68% 100%)}#screen.test #time{color:#fff;background:#0009;font-size:12vw;padding:20px;margin-top:12vh}#logoWatermark{position:absolute;object-fit:contain;max-height:35vh;pointer-events:none;z-index:0}#controlWatermark{position:absolute;left:2vw;bottom:2vh;color:#fff;opacity:.35;font-size:1.4vw;letter-spacing:.08em;pointer-events:none}#time,#message,#clock{z-index:1;position:relative}#message,#clock{position:absolute}</style></head><body><div id="screen"><img id="logoWatermark" alt="" hidden><div id="controlWatermark" hidden></div><div id="bar"><div id="fill"></div></div><div id="time">00:05:00</div><div id="message"></div><div id="clock"></div></div><button id="fullscreen">⛶ Vollbild</button><div id="disconnected">Verbindung unterbrochen · Anzeige pausiert</div><script type="module" src="/display.js"></script></body></html>
